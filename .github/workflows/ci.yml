name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test_urdf_xacro (ros:kilted)
    runs-on: ubuntu-latest
    container: ros:kilted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/microduck_description

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ros-kilted-ament-cmake-pytest \
            ros-kilted-robot-state-publisher \
            ros-kilted-xacro

      - name: colcon build
        run: |
          . /opt/ros/kilted/setup.sh
          colcon build --packages-select microduck_description

      - name: colcon test
        run: |
          . /opt/ros/kilted/setup.sh
          . install/setup.sh
          colcon test --packages-select microduck_description --event-handlers console_direct+
          colcon test-result --verbose
